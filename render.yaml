databases:
  - name: routing-db
    plan: free
    region: oregon
    databaseName: routing
    user: routing
    ipAllowList: []

services:
  - type: web
    name: routing-api
    runtime: python
    plan: free
    region: oregon
    rootDir: mi_proyecto_routing
    buildCommand: bash build.sh
    startCommand: gunicorn mi_proyecto_routing.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /authors
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: routing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: LOAD_DEMO_DATA
        value: "True"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
